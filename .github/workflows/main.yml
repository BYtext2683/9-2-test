name: Build Debug APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 固定签名密钥：优先使用仓库 Secrets（推荐，永久稳定）；
      # 没有配置 Secrets 时退而求其次：恢复缓存里自动生成的密钥，
      # 保证同一仓库的多次构建签名一致（缓存被清理后会重新生成，届时需重装一次）。
      # 注意：GitHub 规定 secrets 不能直接用于 if 条件，所以这里缓存步骤无条件运行：
      # 配置了 Secret 时，下面的解码步骤会覆盖缓存里的旧密钥，最终仍以 Secret 为准。
      - name: Restore cached signing keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/mediaalbum-release.jks
          key: mediaalbum-keystore-v1

      - name: Set up signing keystore
        run: |
          mkdir -p "$HOME/.android"
          KS="$HOME/.android/mediaalbum-release.jks"
          if [ -n "${{ secrets.MEDIAALBUM_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.MEDIAALBUM_KEYSTORE_BASE64 }}" | base64 -d > "$KS"
            echo "MEDIAALBUM_STORE_FILE=$KS" >> "$GITHUB_ENV"
            echo "MEDIAALBUM_STORE_PASSWORD=${{ secrets.MEDIAALBUM_STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "MEDIAALBUM_KEY_ALIAS=${{ secrets.MEDIAALBUM_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "MEDIAALBUM_KEY_PASSWORD=${{ secrets.MEDIAALBUM_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            if [ ! -f "$KS" ]; then
              # PKCS12 密钥库要求 store 密码与 key 密码相同，keytool 会忽略不同的 -keypass，
              # 所以这里两个密码保持一致（androidstorepass）。
              keytool -genkeypair -v -keystore "$KS" -storetype PKCS12 \
                -alias mediaalbum -keyalg RSA -keysize 2048 -validity 10950 \
                -storepass androidstorepass -keypass androidstorepass \
                -dname "CN=MediaAlbum, O=MediaAlbum, C=CN"
            fi
            echo "MEDIAALBUM_STORE_FILE=$KS" >> "$GITHUB_ENV"
            echo "MEDIAALBUM_STORE_PASSWORD=androidstorepass" >> "$GITHUB_ENV"
            echo "MEDIAALBUM_KEY_ALIAS=mediaalbum" >> "$GITHUB_ENV"
            echo "MEDIAALBUM_KEY_PASSWORD=androidstorepass" >> "$GITHUB_ENV"
          fi

      # 手动安装 Android SDK：不依赖 android-actions/setup-android
      # （该 action 会去装谷歌已下线的旧 tools 包而失败）。
      # 注意：runner 镜像预置了指向 /usr/local/lib/android/sdk 的 ANDROID_SDK_ROOT，
      # 必须把 ANDROID_HOME / ANDROID_SDK_ROOT 同时指到同一路径，否则 AGP 报路径冲突。
      - name: Set up Android SDK
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install SDK packages & accept licenses
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Download Gradle 8.9
        run: |
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: cd MediaAlbum && gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaAlbum-debug-apk
          path: MediaAlbum/app/build/outputs/apk/debug/app-debug.apk
